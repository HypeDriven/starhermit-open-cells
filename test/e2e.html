<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Cells E2E harness</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<script>
// Reuse the real index.html body so the harness drives the genuine UI.
fetch('/index.html').then(function (r) { return r.text(); }).then(function (html) {
  var doc = new DOMParser().parseFromString(html, 'text/html');
  document.body.innerHTML = '';
  Array.from(doc.body.children).forEach(function (n) {
    if (n.tagName !== 'SCRIPT') document.body.appendChild(document.importNode(n, true));
  });
  window.confirm = function () { return true; }; // harness auto-confirms
  var results = [];
  window.e2e = { log: function (ok, name, extra) { results.push({ ok: ok, name: name, extra: extra }); console.log((ok ? 'PASS ' : 'FAIL ') + name + (extra ? ' — ' + extra : '')); } };
  var s = document.createElement('script');
  s.src = '../test/e2e-driver.js';
  document.body.appendChild(s);
});
</script>
<script src="../vendor/three.min.js"></script>
<script src="../src/rules.js"></script>
<script src="../src/content.js"></script>
<script src="../src/session.js"></script>
<script src="../src/platform.js"></script>
<script src="../src/audio.js"></script>
<script src="../src/render.js"></script>
<script src="../src/board-dom.js"></script>
<script src="../src/ui.js"></script>
<script src="../src/main.js"></script>
</body>
</html>
