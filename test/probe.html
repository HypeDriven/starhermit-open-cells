fetch('/index.html').then(r=>r.text()).then(function(html){
  var doc = new DOMParser().parseFromString(html,'text/html');
  document.body.innerHTML='';
  Array.from(doc.body.children).forEach(function(n){ if(n.tagName!=='SCRIPT') document.body.appendChild(document.importNode(n,true)); });

});
</script>
